<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<title>找件</title>
<style>
/* The H5 client. One screen at a time: home (say what to find) -> shoot -> work (live agent run) -> result. */
:root {
  --page: #dfe5ee; --app: #f4f6fa; --card: #ffffff; --ink: #111a26; --muted: #6a7686; --faint: #9aa5b3;
  --blue: #1b5fd9; --blue-soft: #e8f0ff; --mark: #ef2b2d; --mark-soft: #ffe9e9;
  --ok: #12855a; --ok-soft: #e3f6ee; --warn: #b45f06; --warn-soft: #fff1dc; --steel: #aeb7c2;
  --f-body: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-code: "DIN Alternate", "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --r-card: 18px;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--page); display: flex; align-items: center; justify-content: center; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
code { font-family: var(--f-code); font-weight: 700; font-size: 1.12em; letter-spacing: .04em; }
[hidden] { display: none !important; }

.screen { position: relative; width: 100%; max-width: 430px; height: 100%; max-height: 900px; background: var(--app); display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 520px) { .screen { height: calc(100% - 48px); border-radius: 30px; box-shadow: 0 40px 80px -30px rgba(17, 26, 38, .45); } }
.head { padding: calc(14px + env(safe-area-inset-top)) 20px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; }
.head h1 { font-size: 26px; font-weight: 900; letter-spacing: .02em; line-height: 1.15; }
.head p { font-size: 12.5px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.off { background: var(--mark-soft); color: var(--mark); }
.back { width: 38px; height: 38px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(17, 26, 38, .08); font-size: 20px; line-height: 1; flex: none; }
.body { flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; -webkit-overflow-scrolling: touch; }
.cta { flex: none; padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; background: linear-gradient(to top, var(--app) 75%, transparent); }
.btn-main { width: 100%; padding: 15px; border-radius: 16px; font-size: 17px; font-weight: 700; color: #fff; letter-spacing: .04em; background: linear-gradient(180deg, #2b70ea, var(--blue)); box-shadow: 0 10px 22px -8px rgba(27, 95, 217, .7), inset 0 1px 0 rgba(255, 255, 255, .25); }
.btn-main:active { transform: scale(.98); }
.btn-main[disabled] { background: var(--steel); box-shadow: none; cursor: default; }
.btn-main small { display: block; font-size: 12px; font-weight: 400; opacity: .85; letter-spacing: 0; }
.btn-2 { width: 100%; padding: 12px; border-radius: 14px; font-weight: 700; background: var(--card); box-shadow: 0 1px 2px rgba(17, 26, 38, .08); }

.me, .ai, .sys { padding: 10px 13px; font-size: 14.5px; animation: rise .3s ease both; overflow-wrap: anywhere; }
.me { align-self: flex-end; max-width: 88%; background: var(--blue); color: #fff; border-radius: 18px 18px 4px 18px; white-space: pre-wrap; }
.ai { background: var(--card); border-radius: 4px 18px 18px 18px; box-shadow: 0 1px 2px rgba(17, 26, 38, .06), 0 10px 22px -16px rgba(17, 26, 38, .3); display: flex; flex-direction: column; gap: 10px; }
.ai .name { font-size: 11.5px; font-weight: 700; color: var(--blue); letter-spacing: .08em; }
.ai .muted { font-size: 13.5px; color: var(--muted); }
.ai h3 { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.sys { align-self: center; font-size: 12.5px; color: var(--mark); background: var(--mark-soft); border-radius: 10px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.eg { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--blue); background: var(--blue-soft); border-radius: 99px; padding: 6px 12px; }

.ticket { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; background: var(--app); border-radius: 12px; padding: 8px 10px; }
.label { width: 76px; background: #fff; border: 1.5px solid #111; border-radius: 4px; padding: 4px 6px 2px; text-align: center; color: #111; }
.label::before { content: ""; display: block; height: 10px; background: repeating-linear-gradient(90deg, #111 0 2px, transparent 2px 3px, #111 3px 4px, transparent 4px 7px, #111 7px 10px, transparent 10px 12px); }
.label b { display: block; font-family: var(--f-code); font-weight: 700; font-size: 25px; line-height: 1.05; }
.ticket .where b { display: block; font-size: 14.5px; }
.ticket .where span { color: var(--muted); font-size: 12.5px; }
.state { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--blue-soft); color: var(--blue); white-space: nowrap; }
.state.ok { background: var(--ok-soft); color: var(--ok); }
.rm { width: 40px; height: 40px; border-radius: 50%; font-size: 22px; line-height: 1; color: var(--faint); margin-right: -6px; }
.rm:active { background: var(--app); color: var(--ink); }
.ticket.done .label { opacity: .45; }
.plan { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: p; }
.plan li { counter-increment: p; display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 13.5px; }
.plan li::before { content: counter(p); width: 20px; height: 20px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.say { display: flex; gap: 8px; background: var(--card); border-radius: 16px; padding: 6px 6px 6px 14px; align-items: flex-end; box-shadow: 0 1px 2px rgba(17, 26, 38, .08); }
.say textarea { flex: 1; min-width: 0; border: 0; background: none; font: inherit; color: var(--ink); padding: 8px 0; resize: none; height: 40px; max-height: 110px; }
.say textarea::placeholder { color: var(--faint); }
.say button { padding: 9px 15px; border-radius: 11px; background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; }
.say button[disabled] { opacity: .4; }
.keybox { display: flex; gap: 8px; }
.keybox input { flex: 1; min-width: 0; font: inherit; border: 1px solid var(--steel); border-radius: 10px; padding: 8px 10px; background: var(--app); color: var(--ink); }
.keybox button { padding: 8px 14px; border-radius: 10px; background: var(--ink); color: #fff; font-weight: 700; }

.photo { position: relative; border-radius: var(--r-card); overflow: hidden; flex: none; background: #c9cfd7; box-shadow: 0 10px 24px -16px rgba(17, 26, 38, .5); line-height: 0; }
.photo img { width: 100%; height: auto; display: block; }
.tile { position: absolute; border: 2px solid #fff; border-radius: 8px; box-shadow: 0 0 0 2px var(--blue), 0 0 0 999px rgba(11, 15, 21, .34); transition: all .35s cubic-bezier(.3, .8, .3, 1); pointer-events: none; overflow: hidden; }
.tile::after { content: ""; position: absolute; left: 0; right: 0; height: 40%; background: linear-gradient(180deg, transparent, rgba(255, 255, 255, .55)); animation: sweep 1s linear infinite; }
@keyframes sweep { from { top: -40%; } to { top: 100%; } }
.fixed-photo { flex: none; padding: 0 16px 10px; }
.shoot-hint { text-align: center; padding: 26px 18px; border: 2px dashed var(--steel); border-radius: var(--r-card); color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.shoot-hint b { font-size: 19px; color: var(--ink); }

.trace { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.trace li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; font-size: 13.5px; animation: rise .28s ease both; }
.trace .k { font-size: 11px; font-weight: 700; text-align: center; border-radius: 6px; padding: 2px 0; margin-top: 1px; letter-spacing: .04em; }
.trace .think { color: var(--muted); } .trace .think .k { background: #eceff4; color: var(--muted); }
.trace .act .k { background: var(--blue); color: #fff; }
.trace .act span { display: inline-flex; align-items: center; gap: 6px; background: var(--blue-soft); color: var(--blue); font-weight: 700; padding: 2px 10px; border-radius: 8px; font-size: 12.5px; }
.trace .act span i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(27, 95, 217, .25); border-top-color: var(--blue); animation: spin .7s linear infinite; }
.trace .act.fin span i { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.trace .see { font-weight: 500; } .trace .see .k { background: var(--ok-soft); color: var(--ok); }
.trace .turn { background: var(--mark-soft); border-radius: 12px; padding: 8px 10px 8px 0; color: #8f1416; font-weight: 500; }
.trace .turn .k { background: var(--mark); color: #fff; margin-left: 8px; }
.trace .ask, .trace .error { background: var(--warn-soft); border-radius: 12px; padding: 8px 10px 8px 0; color: #7a4003; font-weight: 500; }
.trace .ask .k, .trace .error .k { background: var(--warn); color: #fff; margin-left: 8px; }

.zooms { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; flex: none; }
.zoom { position: relative; overflow: hidden; border-radius: 14px; background: #c9cfd7; box-shadow: 0 8px 20px -14px rgba(17, 26, 38, .5); }
.zoom img { position: absolute; max-width: none; height: auto; }
.zoom figcaption { position: absolute; left: 8px; bottom: 8px; background: rgba(17, 26, 38, .78); color: #fff; font-family: var(--f-code); font-weight: 700; font-size: 15px; letter-spacing: .04em; padding: 1px 8px; border-radius: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stats div { background: var(--app); border-radius: 12px; padding: 8px 2px; text-align: center; }
.stats b { display: block; font-family: var(--f-code); font-size: 24px; line-height: 1.1; }
.stats span { font-size: 11px; color: var(--muted); }
.stats .hot b { color: var(--mark); }
.allset { text-align: center; padding: 16px 14px; border-radius: var(--r-card); background: linear-gradient(160deg, #12855a, #0c6a47); color: #fff; }
.allset b { font-size: 21px; font-weight: 900; display: block; letter-spacing: .06em; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="screen" id="screen"></div>
<input type="file" id="camera" accept="image/*" capture="environment" hidden>
<input type="file" id="album" accept="image/*" hidden>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const screen = $("#screen");
const st = { task: null, chat: [], online: null, keyRequired: false, photoUrl: null, photoId: null, summary: null, run: 0 };
const EXAMPLE = "【菜鸟驿站】您的包裹已到站，取件码 8-2-5726、8-2-9442，请凭码领取。";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const codeify = s => esc(s).replace(/\b\d{4}\b/g, "<code>$&</code>");
const place = (shelf, level) => !shelf ? "货架你自己找" : !level ? `${shelf} 号货架` : `${shelf} 号货架第 ${level} 层`;
const key = () => { try { return localStorage.getItem("parcel_key") || ""; } catch { return ""; } };
const withKey = url => key() ? url + (url.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(key()) : url;

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { ...(options.headers || {}), "X-Key": key() } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || "请求失败 " + res.status); e.status = res.status; throw e; }
  return data;
}
const pending = () => st.task ? st.task.parcels.filter(p => p.status !== "found") : [];

function ticket(p, removable) {
  const done = p.status === "found";
  const right = done ? '<span class="state ok">已找到</span>'
    : removable ? `<button class="rm" data-rm="${esc(p.code)}" aria-label="不找 ${esc(p.code)} 了">×</button>`
    : '<span class="state">待找</span>';
  return `<div class="ticket${done ? " done" : ""}"><div class="label"><b>${esc(p.tail)}</b></div>
    <div class="where"><b>${place(p.shelf, p.level)}</b><span>${done ? esc(p.note || "") : esc(p.note || p.code)}</span></div>${right}</div>`;
}
function head(title, sub, back) {
  const pill = st.online === null ? "" : `<span class="pill${st.online ? "" : " off"}">${st.online ? "已连接 · 本地模型" : "未连接"}</span>`;
  return `<div class="head">${back ? '<button class="back" id="back" aria-label="返回">‹</button>' : ""}
    <div style="flex:1;min-width:0"><h1>${title}</h1><p>${sub}</p></div>${pill}</div>`;
}
function go(name, arg) { st.run++; ({ home, shoot, work, result })[name](arg); }

// ---------------------------------------------------------------- home
function home() {
  const todo = pending();
  const planHtml = st.task && st.task.plan.length ? `<h3>我的计划</h3><ol class="plan">${
    st.task.plan.map(g => `<li><div>去 <b>${place(g.shelf, g.level)}</b> 拍一张，找 ${g.tails.map(t => `<code>${esc(t)}</code>`).join("、")}</div></li>`).join("")
    }<li><div>每找到一个都再读一遍确认，全部找齐才算完成</div></li></ol>` : "";
  const taskHtml = st.task ? `<div class="ai"><span class="name">找件助手</span>${
    st.task.parcels.length
      ? `<div>要找 <b>${st.task.parcels.length}</b> 件快递：</div>${st.task.parcels.map(p => ticket(p, true)).join("")}${
          todo.length ? '<div class="muted">走到货架前拍一张，我在照片里找，找到后会再读一遍确认才圈出来。</div>' : "<div>全部找齐了。</div>"}`
      : "<div>这段话里我没有找到取件码。取件码的样子是 <code>8-2-5726</code>，前面是货架号和层号。</div>"}</div>` : "";
  screen.innerHTML = head("找件", "告诉我取件码，剩下的交给我") + `
    <div class="body" id="chat">
      <div class="ai"><span class="name">找件助手</span><div>把取件码告诉我，或者直接把取件短信粘贴进来。然后去货架前拍一张照片，我来找。</div></div>
      ${st.keyRequired && !key() ? `<div class="ai"><span class="name">需要访问口令</span><div class="keybox"><input id="key-input" type="password" placeholder="电脑上设置的口令" autocomplete="off"><button id="key-save">保存</button></div></div>` : ""}
      ${st.chat.map(m => `<div class="${m.who}">${m.who === "me" ? esc(m.text) : m.text}</div>`).join("")}
      ${taskHtml}
      ${st.task ? "" : '<button class="eg" id="eg">用一条示例短信试试</button>'}
    </div>
    <div class="cta">
      ${todo.length ? '<button class="btn-main" id="start">拍货架，开始找</button>' : ""}
      <div class="say"><textarea id="say" rows="1" placeholder="${st.task ? "还要取别的？继续说取件码" : "例如：帮我找 8-2-5726"}"></textarea><button id="send">发送</button></div>
    </div>`;
  const chat = $("#chat"); chat.scrollTop = chat.scrollHeight;
  const say = $("#say"), send = $("#send");
  const submit = async text => {
    text = text.trim(); if (!text) return;
    st.chat.push({ who: "me", text }); send.disabled = true; home();
    try {
      st.task = st.task
        ? await api(`/api/tasks/${st.task.id}/codes`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) })
        : await api("/api/tasks", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    } catch (e) {
      st.chat.push({ who: "sys", text: e.status === 401 ? "访问口令不对" : "连不上电脑上的服务：" + esc(e.message) });
    }
    home();
  };
  send.onclick = () => submit(say.value);
  say.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(say.value); } };
  if ($("#eg")) $("#eg").onclick = () => submit(EXAMPLE);
  screen.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    try {
      st.task = await api(`/api/tasks/${st.task.id}/remove`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: b.dataset.rm }) });
      if (!st.task.parcels.length) st.task = null;
    } catch (e) { st.chat.push({ who: "sys", text: e.status === 404 ? "电脑上找不到这个任务了，请重新告诉我取件码" : esc(e.message) }); if (e.status === 404) st.task = null; }
    home();
  });
  if ($("#start")) $("#start").onclick = () => go("shoot");
  if ($("#key-save")) $("#key-save").onclick = () => { try { localStorage.setItem("parcel_key", $("#key-input").value.trim()); } catch {} home(); };
}

// ---------------------------------------------------------------- shoot
function shoot() {
  const todo = pending(), first = todo[0];
  const same = first ? todo.filter(p => p.shelf === first.shelf && p.level === first.level) : [];
  screen.innerHTML = head("拍货架", `还差 ${todo.length} 件`, true) + `
    <div class="body">
      <div class="shoot-hint"><span>对着你要找的那一排货架拍一张</span><b>找 ${todo.map(p => esc(p.tail)).join("、")}</b>
        <span>${todo.filter(p => p.shelf).map(p => esc(p.tail) + " 在 " + place(p.shelf, p.level)).join("，")}</span></div>
      <div class="ai"><span class="name">怎么拍</span><div>把整层货架和下方的蓝色标牌一起拍进来，尽量正对，别太远。照片只发到你自己的电脑。</div></div>
    </div>
    <div class="cta"><button class="btn-main" id="cam">拍照</button><button class="btn-2" id="pick">从相册选一张</button></div>`;
  $("#back").onclick = () => go("home");
  $("#cam").onclick = () => $("#camera").click();
  $("#pick").onclick = () => $("#album").click();
}
for (const id of ["camera", "album"]) {
  $("#" + id).onchange = async e => {
    const file = e.target.files[0]; e.target.value = "";
    if (file) go("work", { blob: await shrink(file) });
  };
}
/** Phone photos are several MB; 1600px on the long edge is all the agent uses. */
function shrink(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => resolve(b || file), "image/jpeg", 0.9);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

// ---------------------------------------------------------------- work: the live agent run
const KIND = { think: "想", act: "做", see: "看到", turn: "改主意", ask: "问你", error: "出错" };
async function work({ blob, forceOf }) {
  const my = st.run, alive = () => my === st.run;
  if (blob) { if (st.photoUrl) URL.revokeObjectURL(st.photoUrl); st.photoUrl = URL.createObjectURL(blob); }
  screen.innerHTML = head("正在找", "每一步都在你的电脑上本地完成") + `
    <div class="fixed-photo"><div class="photo" id="photo"><img src="${st.photoUrl}" alt="你拍的货架"><div class="tile" id="tile" hidden></div></div></div>
    <div class="body" id="scroll"><ol class="trace" id="trace"></ol></div>`;
  const trace = $("#trace"), scroll = $("#scroll"), tile = $("#tile");
  const box = b => { if (!b) return; tile.hidden = false; Object.assign(tile.style, { left: b[0] * 100 + "%", top: b[1] * 100 + "%", width: (b[2] - b[0]) * 100 + "%", height: (b[3] - b[1]) * 100 + "%" }); };
  const line = (kind, html) => {
    trace.querySelectorAll(".act:not(.fin)").forEach(li => li.classList.add("fin"));
    const li = document.createElement("li"); li.className = kind;
    li.innerHTML = `<span class="k">${KIND[kind] || kind}</span><div>${kind === "act" ? `<span><i></i>${esc(html)}</span>` : codeify(html)}</div>`;
    trace.appendChild(li); scroll.scrollTop = scroll.scrollHeight;
  };
  try {
    const started = forceOf
      ? await api(`/api/photos/${forceOf}/force`, { method: "POST" })
      : await api(`/api/tasks/${st.task.id}/photos`, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
    st.photoId = started.photo_id;
    let after = -1;
    while (alive()) {
      const r = await api(`/api/photos/${st.photoId}/events?after=${after}`);
      for (const e of r.events) {
        after = e.i;
        if (e.kind === "progress") { box(e.tile); continue; }
        if (e.kind === "done") continue;
        box(e.box || e.tile);
        line(e.kind, e.text);
      }
      if (!r.running) {
        if (!alive()) return;
        st.task = r.task; st.summary = r.summary;
        if (!r.summary) { line("error", "这次没有完成，请再试一次。"); addRetry(); return; }
        await new Promise(res => setTimeout(res, 700));
        if (alive()) go("result");
        return;
      }
      await new Promise(res => setTimeout(res, 350));
    }
  } catch (e) {
    if (!alive()) return;
    line("error", e.status === 401 ? "访问口令不对" : "连不上电脑上的服务：" + e.message);
    addRetry();
  }
  function addRetry() {
    const b = document.createElement("button"); b.className = "btn-2"; b.textContent = "返回重拍"; b.onclick = () => go("shoot");
    scroll.appendChild(b); scroll.scrollTop = scroll.scrollHeight;
  }
}

// ---------------------------------------------------------------- result
/** A close-up of one circled parcel: the same annotated photo, cropped by CSS to about 4x the mark. */
function zoom(m, size, src) {
  const [W, H] = size, [x0, y0, x1, y1] = m.box;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const rw = Math.min(1, Math.max((x1 - x0) * 4, 0.3)), rh = Math.min(1, rw * W / H * 0.72);
  const rx = Math.min(Math.max(0, cx - rw / 2), 1 - rw), ry = Math.min(Math.max(0, cy - rh / 2), 1 - rh);
  return `<figure class="zoom" style="aspect-ratio:${(rw * W).toFixed(0)}/${(rh * H).toFixed(0)}">
    <img src="${src}" alt="${esc(m.tail)} 的位置放大图" style="width:${100 / rw}%;left:${-rx / rw * 100}%;top:${-ry / rh * 100}%">
    <figcaption>${esc(m.tail)}${m.verified ? "" : " · 请自己核对"}</figcaption></figure>`;
}
function result() {
  const s = st.summary, left = pending();
  const title = { all_found: "全部找齐", more: s.found.length ? "找到了" : "这张里没有", retake: "需要重拍", other_shelf: "不在这一面" }[s.status] || "结果";
  const img = s.status === "retake" ? st.photoUrl : withKey(`/api/photos/${st.photoId}/annotated.jpg`);
  let cta;
  if (st.task.done) cta = '<button class="btn-main" id="new">再找别的快递</button>';
  else if (s.status === "retake") cta = '<button class="btn-main" id="next">重拍一张</button>';
  else if (s.status === "other_shelf") cta = `<button class="btn-main" id="next">去 ${place(left[0].shelf, left[0].level)} 拍照<small>还差 ${left.length} 件</small></button><button class="btn-2" id="force">就是这一面，仍然在这张里找</button>`;
  else cta = `<button class="btn-main" id="next">拍下一张<small>还差 ${left.length} 件</small></button>`;
  screen.innerHTML = head(title, `调用本地模型 ${s.calls} 次，用时 ${s.seconds} 秒`) + `
    <div class="body">
      <div class="photo"><img src="${img}" alt="圈出结果的货架照片"></div>
      ${(s.marks || []).length ? `<div class="zooms">${s.marks.map(m => zoom(m, s.size, img)).join("")}</div>` : ""}
      <div class="ai"><span class="name">找件助手</span><div>${codeify(s.message)}</div>
        <h3>这一张里它做了什么</h3>
        <div class="stats"><div><b>${s.calls}</b><span>次调用模型</span></div><div class="${s.turns ? "hot" : ""}"><b>${s.turns}</b><span>次改主意</span></div>
          <div><b>${s.asks}</b><span>次问你</span></div><div><b>${s.seconds}</b><span>秒</span></div></div>
        <h3>任务进度 ${st.task.parcels.length - left.length} / ${st.task.parcels.length}</h3>
        ${st.task.parcels.map(p => ticket(p, false)).join("")}
      </div>
      ${st.task.done ? `<div class="allset"><b>全部找齐</b><span>共 ${st.task.parcels.length} 件，${st.task.photos.length} 张照片</span></div>` : ""}
    </div>
    <div class="cta">${cta}</div>`;
  if ($("#next")) $("#next").onclick = () => go("shoot");
  if ($("#force")) $("#force").onclick = () => go("work", { forceOf: st.photoId });
  if ($("#new")) $("#new").onclick = () => { st.task = null; st.chat = []; go("home"); };
}

// ---------------------------------------------------------------- start
(async () => {
  // Opening the page once as /?key=... saves the access key on this device and drops it from the address bar.
  const given = new URLSearchParams(location.search).get("key");
  if (given) { try { localStorage.setItem("parcel_key", given); } catch {} history.replaceState(null, "", location.pathname); }
  home();
  try { const h = await api("/api/health"); st.online = true; st.keyRequired = h.key_required; }
  catch { st.online = false; }
  if (!st.task) home();
  // Developer check: ?autotest=<image url> runs one full round without touching the camera.
  const auto = new URLSearchParams(location.search).get("autotest");
  if (auto) {
    st.chat.push({ who: "me", text: EXAMPLE });
    st.task = await api("/api/tasks", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: EXAMPLE }) });
    go("work", { blob: await (await fetch(auto)).blob() });
  }
})();
</script>
